[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fontem-neo4j-sink"
version = "0.1.0"
description = "Neo4j projection sink for the fontem event log."
requires-python = ">=3.11"
# fontem-events and fontem-event-schemas are pinned to the exact
# version of the wheel we vendor under `vendor/*.whl`. Bumping the
# pin without dropping a matching wheel into vendor/ (or vice-versa)
# fails the Docker build — see `vendor/CHECK_VERSIONS.md`.
dependencies = [
    "fontem-events==0.2.0",
    "fontem-event-schemas==0.1.0",
    "neo4j>=5.23.0",
    "psycopg[binary]>=3.3.4",
    "prometheus-client>=0.22.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3.1"]

[project.scripts]
neo4j-sink = "neo4j_sink.__main__:main"

[tool.setuptools.packages.find]
include = ["neo4j_sink*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Pylint config — disable stylistic rules that don't fit an internal
# event sink:
#   missing-{module,class,function}-docstring — typed signatures +
#     symbol names already document the surface; docstring stubs
#     would just be lint-debt.
#   too-few-public-methods — Pydantic-style typed envelopes and
#     dataclass-only event holders legitimately have no methods.
#   duplicate-code — pylint's similarity detector flags the
#     near-identical `render_upsert_*` shapes, which is intrinsic
#     to the cypher.RENDERERS pattern.
[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "duplicate-code",
]

# Test files legitimately reach into private fragments (the cypher
# helpers prefix `_name_clean_fragment` to mark them sink-internal,
# but the tests are the cleanest place to lock that behavior down).
[tool.pylint.basic]
no-docstring-rgx = "^_|^test_"
