[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gmr-neo4j-sink"
version = "0.1.0"
description = "Neo4j projection sink for the gmr_app event log."
requires-python = ">=3.11"
dependencies = [
    "gmr-events",
    "gmr-event-schemas",
    "neo4j>=5.20",
    "psycopg[binary]>=3.1",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
neo4j-sink = "neo4j_sink.__main__:main"

[tool.setuptools.packages.find]
include = ["neo4j_sink*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
