[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fontem-event-schemas"
version = "0.1.0"
description = "JSON Schemas for the gmr_app events.entity_events log."
requires-python = ">=3.11"
authors = [{ name = "Fontem", email = "ops@void42.internal" }]
license = { text = "Internal-only" }
dependencies = [
    "jsonschema>=4.21",
]

[tool.setuptools.packages.find]
include = ["fontem_event_schemas*"]

[tool.setuptools.package-data]
fontem_event_schemas = ["schemas/v*/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
