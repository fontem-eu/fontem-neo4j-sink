name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: python
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        env:
          GMR_CI_READ_TOKEN: ${{ secrets.CI_READ_TOKEN }}
        run: |
          # Internal deps that aren't on the proxy index — clone + install.
          tmpdir=$(mktemp -d)
          for repo in fontem-event-schemas fontem-events; do
              git clone --depth 1 \
                  "http://lucid:${GMR_CI_READ_TOKEN}@contribute.void42.internal/fontem/${repo}.git" \
                  "$tmpdir/$repo"
              pip install --no-cache-dir "$tmpdir/$repo"
          done
          pip install --no-cache-dir -e '.[test]'
          pip install --no-cache-dir pylint
      - name: pytest
        run: pytest -v
      - name: Lint
        run: pylint neo4j_sink tests

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: void42/ci-actions
          path: .ci-actions
          token: ${{ secrets.CI_READ_TOKEN }}
      - name: OSV-Scanner lockfile gate
        uses: ./.ci-actions/actions/osv-scan
      - name: Secret scan (gitleaks)
        uses: ./.ci-actions/actions/secret-scan

  analyze:
    needs: test
    runs-on: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: void42/ci-actions
          path: .ci-actions
          token: ${{ secrets.CI_READ_TOKEN }}
      - name: Install dependencies and generate coverage
        env:
          GMR_CI_READ_TOKEN: ${{ secrets.CI_READ_TOKEN }}
        run: |
          # Internal deps that aren't on the proxy index — clone + install.
          tmpdir=$(mktemp -d)
          for repo in fontem-event-schemas fontem-events; do
              git clone --depth 1 \
                  "http://lucid:${GMR_CI_READ_TOKEN}@contribute.void42.internal/fontem/${repo}.git" \
                  "$tmpdir/$repo"
              pip install --no-cache-dir "$tmpdir/$repo"
          done
          pip install --no-cache-dir -e '.[test]'
          pip install --no-cache-dir pylint pytest-cov
          pytest --cov=neo4j_sink --cov-report=xml:coverage.xml || true
      - uses: ./.ci-actions/actions/sonar-scan
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}

  build-deploy:
    needs: [test, security]
    if: github.ref == 'refs/heads/main'
    runs-on: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: void42/ci-actions
          path: .ci-actions
          token: ${{ secrets.CI_READ_TOKEN }}

      - id: sbom
        name: Generate + upload SBOM
        uses: ./.ci-actions/actions/sbom-generate
        with:
          language: python
          project-name: fontem-neo4j-sink
          project-version: ${{ github.sha }}

      - id: image
        name: Build, push, sign, attest
        uses: ./.ci-actions/actions/docker-build-sign
        with:
          image: contribute.void42.internal/fontem/fontem-neo4j-sink
          cosign-key: ${{ secrets.COSIGN_KEY }}
          registry-user: ${{ secrets.REGISTRY_USER }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
          sbom-path: ${{ steps.sbom.outputs.sbom-path }}

      # Sinks aren't deployed via a Helm chart — their Deployment lives
      # inline in gitops/infra/{staging,prod}.yaml as a literal image
      # tag. We can't reuse the gitops-bump action (which expects
      # <env>/<service>.yaml with a `version:` field). Bump the literal
      # `image:` line directly in infra/staging.yaml for the testing+staging
      # envs that consume the same manifest.
      - name: Bump image tag in gitops infra
        env:
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          rm -rf /tmp/gitops
          # Explicit ${USER}:${TOKEN}@ form; OAuth2 scheme rejects
          # the registry deploy token even when the same combo is
          # accepted for `docker login` to gitea-registry.
          git clone --depth=1 \
            "https://${{ secrets.REGISTRY_USER }}:${{ secrets.REGISTRY_PASSWORD }}@contribute.void42.internal/fontem/gitops.git" \
            /tmp/gitops
          cd /tmp/gitops
          # Only auto-bump non-prod (testing/staging share infra/staging.yaml).
          # Prod stays manual; the user bumps infra/prod.yaml when ready.
          sed -i -E "s|(image: contribute\.void42\.internal/fontem/fontem-neo4j-sink:)[^\"[:space:]]+|\1${TAG}|" \
            infra/staging.yaml || true
          git config user.name "Fontem CI"
          git config user.email "ci@void42.internal"
          git add infra/staging.yaml
          git diff --cached --quiet && { echo "No-op bump (already at $TAG)"; exit 0; }
          git commit -m "ci: deploy fontem-neo4j-sink ${TAG} to testing+staging [skip ci]"
          git push origin main
